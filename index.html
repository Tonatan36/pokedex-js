<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ewerton Natan | Pokédex API Pro</title>
    <!-- Normalize CSS para padronizar os navegadores -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Seu CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="content">
        <h1>Pokédex Pro</h1>
        <p class="subtitle">Consumo de API REST & Manipulação de Dados</p>

        <!-- Lista de Pokémons -->
        <ol id="pokemonList" class="pokemons">
            <!-- Os cards dos pokémons serão inseridos aqui via JavaScript -->
        </ol>

        <!-- Botão de Paginação -->
        <div class="pagination">
            <button id="loadMoreButton" type="button" class="btn-load">
                Carregar Mais
            </button>
        </div>
    </main>

    <!-- Nosso arquivo JavaScript -->
    <script src="poke-api.js"></script>
    <script src="main.js"></script>
</body>
</html>
